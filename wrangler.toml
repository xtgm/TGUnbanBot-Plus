# wrangler.toml
name = "tc033"
main = "_worker.js"
compatibility_date = "2026-05-19"
keep_vars = true

# D1 数据库（唯一存储后端，必须绑定；表结构由代码自动建立）
[[d1_databases]]
binding = "DB"								# D1 绑定名默认不可修改
database_name = "tc033-apac"
database_id = "eb0cdc8c-5284-4ddf-ba34-338fed1fa6f8"

# Cloudflare Workers AI：广告检测第三层（语义相似度）。未绑定时检测自动降级为「评分 + 指纹」两层，不影响其它功能。
[ai]
binding = "AI"								# AI 绑定名默认不可修改

# Cloudflare Queues：用于 /ban /spam /unban 超出同步安全预算后的批量任务自动分阶段续接，避免 Worker HTTP 自调用和单次子请求超限。
# 部署前先创建同名队列：wrangler queues create tg-unban-bot-plus-bulk
[[queues.producers]]
binding = "BULK_QUEUE"
queue = "tc0333"

[[queues.consumers]]
queue = "tc0333"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3

# Cron 触发器：广告检测第三道闸（定时滚动复查 bio）。
# 抓的是「先用干净资料混进来、发几句正常话过检，事后才把简介改成广告」的号 ——
# 这类号改完就不再发言，消息路径永远触发不到，只能靠定时扫描。
# 数据源是代码自建的 ad_group_members（发言者名册），因为 Bot API 没有列出群全部成员的方法。
# 每次触发扫 300 个（10 批 × 30 个、批间隔 3 秒，约 10 req/s，远离 Telegram 约 30 req/s 的限流线）；
# 当日总量由 D1 里的计数按 UTC 日期戳约束，配多个时间点也不会超额。
# 3:17 / 15:17 UTC：错开整点，避开 Cloudflare 平台侧 cron 在 :00 的集中触发高峰。
[triggers]
crons = ["17 3 * * *", "17 15 * * *"]

[observability]
enabled = false			# 顶层 Observability 配置。当前配置不通过顶层开关一次性启用，下面单独开启 logs、关闭 traces。
head_sampling_rate = 1	# 顶层采样率，范围 0~1；1 表示 100% 采样，0.1 表示 10% 采样。

[observability.logs]
enabled = true			# 启用 Workers Logs，可在 Cloudflare 后台查看 console.log、错误和调用日志。
head_sampling_rate = 1	# 日志采样率，范围 0~1；低流量可用 1，高流量建议按需改成 0.1 或 0.01。
persist = true			# 是否把日志保存到 Cloudflare 后台，便于后续查询。
invocation_logs = true	# 是否记录每次 Worker 调用的基础日志，例如请求、响应状态和耗时。

[observability.traces]
enabled = false			# 是否启用链路追踪。本项目通常不需要，排查复杂性能问题时再改为 true。
persist = true			# 若启用 traces，是否把追踪数据保存到 Cloudflare 后台。
head_sampling_rate = 1	# traces 采样率；enabled = false 时不生效。
